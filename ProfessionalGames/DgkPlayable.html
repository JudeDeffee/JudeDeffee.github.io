        /* Image classes for JS */
        .Img-TapMatchingSymbol {
            background-image: var(--img-exampleImage);
        }

        .Img-Star{
            mask-image: var(--img-Star);
        }

        .Img-Animal1{
            background-image: var(--img-Animal1);
        }

        .Img-Animal2{
            background-image: var(--img-Animal2);
        }

        .Img-Animal3{
            background-image: var(--img-Animal3);
        }

        .Img-Animal4{
            background-image: var(--img-Animal4);
        }

        .Img-Animal5{
            background-image: var(--img-Animal5);
        }

        .Img-Animal6{
            background-image: var(--img-Animal6);
        }

        /* Particles */
        #physicsWrapper{
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            top: 0px;
            pointer-events: none;
        }

        #canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;                                                
            transform-origin: 50% 50%;
            border-radius: 50%;;
            background-position: center;
            background-size: contain;
        }

        /* Body */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
        }

        /* Main containers */
        #main-content {
            background-color: white;
            width: 100%;
            height: 100vh;            
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            position: relative;
            background-image: var(--img-MainBackground);
        }

        #transition{
            position: absolute;
            width: 100%;
            height: 100vh;                                    
            opacity: 0;
            pointer-events: none;
            justify-content: center;
            align-items: center;
            display: flex;
        }

        #end-screen{
            position: absolute;
            width: 100%;
            height: 100vh; 
            background-size: cover;
            background-position: center;       
            pointer-events: none;     
        }        

        /* Main content */
        .topBar{
            width: 100%;
            height: 15%;            
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .playArea{
            width: 100%;
            height: 85%;            
            display: flex;
        }

        .sideBars{
            width: 15%;
            height: 100%;        
            display: flex;
            justify-content: center;
            align-items: center;    
        }

        .stageWrapper{
            flex-grow: 1;
            height: 100%;            
            display: flex;
            justify-content: center;
            align-items: center;                   
        }

        #stage{
            width: 100%;
            height: 90%;
            background-color: black;
            outline-color: #f39932;
            border-radius: 10px;
            outline-width: 10px;
            outline-style: solid;                
            /* Bottom-left shadow */
            box-shadow: -18px 18px 4px rgba(0,0,0,0.6);            
        }

        #animalInfo{
            width: fit-content;
            height: 70%;
            background-color: rgb(208, 208, 208);
            outline-color: #e463d4;
            border-radius: 10px;
            outline-width: 10px;
            outline-style: solid;
                
            /* Bottom-left shadow */
            box-shadow: -18px 18px 4px rgba(0,0,0,0.6);

            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 10px;
            padding-left: 2%;
            padding-right: 2%;            
        }

        .staticAnimal{
            height: 10vh;
            aspect-ratio: 1;            
            margin: auto;                     
            transform: scale(0);
            background-position: center;
            background-size: contain;            
            display: flex;
            justify-content: center;
            align-items: center;            
            background-blend-mode: screen;
            transition: background-color 0.5s ease;
        }

        .movingAnimal{
            position: absolute;            
            height: 8vw;
            aspect-ratio: 1;            
            border-radius: 10px;
            background-position: center;
            background-size: contain; 
            z-index: 0;                                   
        }

        .checkMark{
            position: absolute;
            width: 80%;
            height: 80%;
            background-image: var(--img-Tick);
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            animation: punchShow 0.5s forwards;            
        }

        #jar{
            position: relative;
            width: 10vw;
            aspect-ratio: 448/667;            
        }

        #jarAnimRoot{
            position: absolute;
            width: 100%;
            height: 100%;
        }

        #jarGraphicWrapper{            
            position: absolute;
            width: 100%;
            aspect-ratio: 448/667;            
            top: 9%;            
        }

        #jarGraphic{            
            position: absolute;
            width: 100%;
            aspect-ratio: 448/667;            
            top: 9%;  
            background-image: var(--img-Jar);            
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 2;
        }

        #jarLid{
            position: absolute;
            width: 100%;
            aspect-ratio: 448/178;
            background-image: var(--img-JarLid);            
            background-size: contain;
            background-repeat: no-repeat;
            top: -3%;
            z-index: 2;
        }

        #jarBack{
            position: absolute;
            width: 100%;
            aspect-ratio: 448/110;
            background-image: var(--img-JarBack);            
            background-size: contain;
            background-repeat: no-repeat;
            top: -12.3%;
            z-index: 0;
        }
        
        /* Transition */
        #transitionBg{
            width: 100%;
            height: 100vh;            
            background-size: cover;
            background-position: center;
            background-color: purple;
            opacity: 0;
            transition: opacity .8s ease;
            position: absolute;
        }

        #transitionSplash{
            height: 80%;
            aspect-ratio: 1;
            background-image: var(--Img-Transition);
            background-size: contain;
            background-repeat: no-repeat;  
            background-position: center;            
        }

        @keyframes transitionAnim{
            0%{
                transform: scale(0) rotateZ(-90deg)
            }
        
            40% {
                transform: scale(1) rotateZ(0deg)
            }
        
            60% {
                transform: scale(1) rotateZ(0deg)
            }
        
            100% {
                transform: scale(0) rotateZ(90deg)
            }
        }

        /* Global animations */
        @keyframes punchShow {
            0% {
                transform: scale(0);
            }
        
            70% {
                transform: scale(1.2);
            }
        
            100% {
                transform: scale(1);
            }
        }

        @keyframes punchHide {
            0% {
                transform: scale(1);
            }
        
            30% {
                transform: scale(1.2);
            }
        
            100% {
                transform: scale(0);
            }
        }
    </style>

    <script>
        //Tools
        function Clamp(value, min, max) {
            return Math.min(Math.max(value, min), max);
        }

        function vectorToRadians(v) {
            return Math.atan2(v.y, v.x);
        }

        function randomRange(start, end) {
            return Math.random() * (end - start) + start;
        }

        function waitForSeconds(seconds) {
            return new Promise(resolve => setTimeout(resolve, seconds * 1000));
        }

        function lerp(start, end, t) {
            return start + (end - start) * t;
        }
        
        const EaseType = {
            LINEAR: 'linear',
            EASE_IN_QUAD: 'inQuad',
            EASE_OUT_QUAD: 'outQuad',
            EASE_IN_OUT_QUAD: 'inOutQuad'
        };
        
        function ApplyEasing(t, easeType) {
            switch (easeType) {
                case EaseType.LINEAR:
                    return t;
                case EaseType.EASE_IN_QUAD:
                    return t * t;
                case EaseType.EASE_OUT_QUAD:
                    return t * (2 - t);
                case EaseType.EASE_IN_OUT_QUAD:
                    return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
                default:
                    return t;
            }
        }

        //Tweening
        function ReparentAndTween(element, initParent, endParent, endPosition, endRotation = 0, endScale = 1, duration = 0.5, easing = easeType.LINEAR, arcMultiplier = 0)
        {
            //Configure rects
            let startRect;                
            let endRect = endParent.getBoundingClientRect();
            if (initParent) startRect = initParent.getBoundingClientRect();                
            else startRect = element.getBoundingClientRect();
        
            //Get position
            const start = new Vector2(startRect.left - endRect.left, startRect.top - endRect.top);
            const end = new Vector2(endPosition.x - (element.clientWidth / 2), endPosition.y - (element.clientHeight / 2));
            const arc = start.Add(end.Subtract(start).Divide(2)).Add(new Vector2(0,-1).Multiply(arcMultiplier));
    
            //Reparent + move
            endParent.appendChild(element);
            element.style.transform = `translate(${start.x}px, ${start.y}px)`;
            element.getBoundingClientRect();
        
            //Tween
            DoTween(element, new QuadraticBezier(start, arc, end), endRotation, endScale, duration, easing);
        }

        function DoTween(element, bezier, endRotation, endScale, duration, easing)
        {
            const startTime = performance.now();
            const durMs = duration * 1000;                     

            function loop(now)
            {
                //Compute t
                let t = Math.min((now - startTime) / durMs, 1);
                t = ApplyEasing(t, easing);
                
                //Calculate values
                let p = bezier.Evaluate(t);
                let r = lerp(0, endRotation, t);
                let s = lerp(1, endScale, t);

                //Apply styles
                element.style.transform = `translate(${p.x}px, ${p.y}px) rotateZ(${r}deg) scale(${s})`;
                

                if (t < 1) requestAnimationFrame(loop);
            }
        
            requestAnimationFrame(loop);
        }

        //Classes        
        class Vector2 {
            constructor(x = 0, y = 0) {
                this.x = x;
                this.y = y;
            }
        
            //Mutators
            MTranslate(v){
                this.x += v.x;
                this.y += v.y;
                return this;
            }
        
            MMultiply(scaler){
                this.x *= scaler;
                this.y *= scaler;
                return this;
            }
        
            MClamp(min, max){
                this.x = Clamp(this.x, min, max);
                this.y = Clamp(this.y, min, max);
                return this;
            }
        
            //Non mutating
            Add(v){
                return new Vector2(this.x + v.x, this.y + v.y)
            }
        
            Subtract(v){
                return new Vector2(this.x - v.x, this.y - v.y)
            }  
        
            Multiply(scaler){
                return new Vector2(this.x * scaler, this.y * scaler);
            }     
        
            Divide(dividend){
                return new Vector2(this.x / dividend, this.y / dividend)
            }

            Magnitude() {
                return Math.sqrt(this.x * this.x + this.y * this.y);
            }
        
            Normalize() {
                const mag = this.Magnitude();
                if (mag === 0) return new Vector2(0, 0);
                return new Vector2(this.x / mag, this.y / mag);
            }
        }

        class QuadraticBezier{
            constructor(p1, p2, p3) {
                this.p1 = p1;
                this.p2 = p2;
                this.p3 = p3;
            }
        
            Evaluate(t){
                let A = this.p1.Multiply(1-t).Add(this.p2.Multiply(t));
                let B = this.p2.Multiply(1-t).Add(this.p3.Multiply(t));
                let P = A.Multiply(1-t).Add(B.Multiply(t));
                return P;
            }
        }

        class ParticleSystem{
            constructor({lifetime = null, speed = 0, startSize = null, color = null, gravityModifier = 0, linearDrag = .5, burstCount = 1, texture = null, 
                useTrail = true, relativeTrailWidth = 1,
                useOpacityOverLifetime = false, 
                sizeOverLifetimeCurve = null} = {})
            {
                this.lifetime = lifetime;
                this.speed = speed;
                this.startSize = startSize;        
                this.color = color;
                this.gravityModifier = gravityModifier;
                this.linearDrag = linearDrag;
                this.burstCount = burstCount;
                this.texture = texture;
                this.useTrail = useTrail;
                this.relativeTrailWidth = relativeTrailWidth;
                this.useOpacityOverLifetime = useOpacityOverLifetime;
                this.sizeOverLifetimeCurve = sizeOverLifetimeCurve;
            }
        
            CreateBurst(location)
            {
                //Fragment is utilised to allow all elements to be added to the DOM in one operation
                //This allows for less reflow and better performance
                const fragment = document.createDocumentFragment();
            
                for(let i = 0; i < this.burstCount; i++)
                {
                    //---------------------------------------------------------------------------------
                    //SETUP VARS
                    //---------------------------------------------------------------------------------
                
                    //Lifetime
                    let pLifeTime = 0;
                    if (this.lifetime instanceof Vector2)
                        pLifeTime = randomRange(this.lifetime.x, this.lifetime.y);
                    else
                        pLifeTime = this.lifetime;
                
                    //Speed
                    let pSpeed = 0;
                    if (this.speed instanceof Vector2)
                        pSpeed = randomRange(this.speed.x, this.speed.y);
                    else
                        pSpeed = this.speed;
                
                    //Size
                    let pStartSize = 0;
                    if (this.startSize instanceof Vector2)
                        pStartSize = randomRange(this.startSize.x, this.startSize.y);
                    else
                        pStartSize = this.startSize;
                
                    //Color
                    let pColor = null;
                    if (this.color instanceof Array)
                        pColor = this.color[Math.floor(Math.random() * this.color.length)];            
                    else
                        pColor = this.color;
                
                    //Gravity modifier
                    let pGravity = 9.8 * this.gravityModifier;
                
                    //---------------------------------------------------------------------------------
                    //CREATE PARTICLE
                    //---------------------------------------------------------------------------------
                
                    let nextParticle = new Particle({
                        position: new Vector2(location.x, location.y),
                        velocity: new Vector2(randomRange(-1,1), randomRange(-1,1)).Normalize().Multiply(pSpeed),
                        lifeTime: pLifeTime,
                        startSize: pStartSize,
                        color: pColor,
                        gravity: pGravity,
                        linearDrag: this.linearDrag,
                        useTrail: this.useTrail,
                        relativeTrailWidth: this.relativeTrailWidth,
                        texture: this.texture,
                        useOpacityOverLifetime: this.useOpacityOverLifetime,
                        parentFragment: fragment,
                        sizeOverLifetimeCurve: this.sizeOverLifetimeCurve,
                    });
                
                    particles.push(nextParticle);
                }
            
                //Append all particles to DOM
                physicsWrapper.appendChild(fragment);
            }
        }

        class Particle{
            constructor({
                position = null,
                velocity = null,
                lifeTime = null,
                startSize = null,
                color = null,
                texture = null,
                gravity = null,
                linearDrag = 0.5,
                useTrail = false,
                relativeTrailWidth = 1,
                useOpacityOverLifetime = false,
                sizeOverLifetimeCurve = null,
                parentFragment = null,
            } = {}) 
            {
                //Tags
                this.dead = false;
            
                //Physics
                this.position = position;
                this.velocity = velocity;
                this.gravity = gravity;
                this.linearDrag = linearDrag;
            
                //Life
                this.lifeTime = lifeTime;
                this.age = 0;
            
                //Color modifiers
                this.useOpacityOverLifetime = useOpacityOverLifetime;
                this.opacity = 1;
            
                //Size
                this.sizeOverLifetimeCurve = sizeOverLifetimeCurve;
                this.startSize = startSize;
                this.size = startSize;
            
                //Object
                this.object = document.createElement("div");
                this.object.classList.add("particle");
                this.object.style = `width: ${startSize}px; height: ${startSize}px;`;
            
                if (texture != null) 
                {
                    //Support for inlined files
                    if (texture.startsWith("url("))
                        this.object.style.maskImage = texture;
                    else if (texture.startsWith("Img-"))
                        this.object.classList.add(texture);

                    this.object.style.maskSize = "contain";
                    this.object.style.maskPosition = "center";
                    this.object.style.maskRepeat = "no-repeat";
                }
            
                this.object.style.backgroundColor =`rgb(${color.r}, ${color.g}, ${color.b})`;
            
                if (parentFragment != null)
                    parentFragment.appendChild(this.object);
                else
                    physicsWrapper.appendChild(this.object);
            
                //Trail parameters
                this.useTrail = useTrail;
                this.trail = [];
                this.trailColor = color;
                this.relativeTrailWidth = relativeTrailWidth;
                this.maxTrailLength = 20;
            }

            TickParticle(deltaTime)
            {
                //Check lifetime
                if (this.lifeTime != 0){
                    this.age += deltaTime;
                    if (this.age >= this.lifeTime)
                    {
                        this.dead = true;
                        return;
                    }
                }    
            
                //Calculate velocity and position
                this.velocity.MTranslate(new Vector2(0, this.gravity * deltaTime));        
                this.velocity.MClamp(-terminalVelocity, terminalVelocity);
                this.velocity.MMultiply(1 - this.linearDrag * deltaTime);//Apply linear drag
                this.position.MTranslate(this.velocity.Multiply(pixelsPerMeter)); //Apply final translation        
            
                //Bounds check
                if (this.position.y > window.innerHeight + this.maxTrailLength * terminalVelocity)
                    this.dead = true;
            
                //Apply styles
                if (this.object != null)
                {
                    const halfWidth = this.object.offsetWidth / 2;
                    const halfHeight = this.object.offsetHeight / 2;
                    this.object.style.transform = `translate(${this.position.x }px, ${this.position.y}px) translate(-50%, -50%) rotate(${vectorToRadians(this.velocity)}rad)`;
                }
            
                //Update trail
                if (this.useTrail)
                    this.UpdateTrail();
            
                //Update opacity
                if (this.useOpacityOverLifetime){
                    this.opacity = 1 - Math.pow((this.age / this.lifeTime), 3); //Cubic fade
                    this.object.style.opacity = this.opacity;
                }
            
                //Update size
                if (this.sizeOverLifetimeCurve != null){            
                    this.size = this.startSize * this.sizeOverLifetimeCurve(this.age / this.lifeTime);
                    console.log(this.sizeOverLifetimeCurve(this.age / this.lifeTime));
                    this.object.style.width = `${this.size}px`;
                    this.object.style.height = `${this.size}px`;
                }
            }
        
            UpdateTrail()
            {
                //Update position history
                this.trail.push(new Vector2(this.position.x, this.position.y));    
                if (this.trail.length > this.maxTrailLength)
                    this.trail.shift();

                // Draw trail with fading alpha for each segment
                if (this.trail.length > 1) {            
                    for (let i = 0; i < this.trail.length - 1; i++) {
                        const p0 = this.trail[i];
                        const p1 = this.trail[i + 1];
                        //Alpha increases towards tail
                        const alpha = ((i + 1) / this.trail.length) * this.opacity; // 0..0.9
                        ctx.lineWidth = ((i + 1) / this.trail.length) * (this.size * this.relativeTrailWidth);
                        ctx.strokeStyle = `rgba(${this.trailColor.r}, ${this.trailColor.g}, ${this.trailColor.b}, ${alpha})`;
                        ctx.beginPath();
                        ctx.moveTo(p0.x, p0.y);
                        ctx.lineTo(p1.x, p1.y);
                        ctx.stroke();
                    }
                }
            }
        }

                this.scale = this.velocity.x > 0 ? 1 : -1;
                this.typeIndex = typeIndex; //Good / Bad index
            }

        //Main functions
        async function TransitionToScreen(currentScreen, nextScreen)
        {
            const transitionWrapper = document.getElementById("transition");
            const transitionBg = document.getElementById("transitionBg");
            const transitionSplash = document.getElementById("transitionSplash");

            transitionWrapper.style.opacity = 1;
            transitionBg.style.opacity = 0;
            transitionSplash.style.animation = "none";
            transitionSplash.style.opacity = 0;

            //Force reflow
            transitionBg.getBoundingClientRect();

            currentScreen.style.pointerEvents = "none";
            nextScreen.style.pointerEvents = "all";
            transitionBg.style.opacity = 1;

            await waitForSeconds(0.2);
            transitionSplash.style.opacity = 1;
            transitionSplash.style.animation = "transitionAnim 2s forwards";

            await waitForSeconds(1.8);
            transitionBg.style.opacity = 0;

            currentScreen.style.opacity = 0;
            nextScreen.style.opacity = 1;
        }

        function PickAnimals()
        {
            goodAnimals = [animals[0], animals[1], animals[2]];
            badAnimals = [animals[3], animals[4], animals[5]];
            matchedAnimals = [0, 0, 0];
        }

        function PickSpawns(requiredSpawns, stage, padding)
        {
            var minDistance = 200;            
            while (spawns.length < requiredSpawns)
            {
                let randomPoint = new Vector2(
                    randomRange(padding, stage.clientWidth-padding), 
                    randomRange(padding, stage.clientHeight-padding)
                );

                //Check if valid
                let valid = true;
                for (const point of spawns)
                {
                    if (point.Subtract(randomPoint).Magnitude() < minDistance)
                    {                        
                        valid = false;
                        break;                  
                    }
                }

                if (valid)
                {
                    spawns.push(randomPoint);                    
                    continue;
                }                    

                minDistance *= 0.995; //Relax distance over time to avoid infinite loops
            }
        }

        async function PlaceAnimals()
        {
            //Init vars
            const stage = document.getElementById("stage");
            const infoBar = document.getElementById("animalInfo");
            PickSpawns(animalCount * goodAnimals.length, stage, 50);            

            //Place static animals in info bar
            for (const imgAnimal of goodAnimals)
            {
                const staticAnimalDiv = document.createElement("div");
                staticAnimalDiv.classList.add("staticAnimal");
                staticAnimalDiv.classList.add(imgAnimal);
                infoBar.appendChild(staticAnimalDiv);

                staticAnimals.push(staticAnimalDiv);
            }                    

            //Good animals
            let spawnIndex = 0;
            for (let x = 0; x < goodAnimals.length; x++) {
                staticAnimals[x].style.animation = "punchShow .5s forwards";
                const imgAnimal = goodAnimals[x];
            
                await waitForSeconds(0.3);
            
                for (let y = 0; y < animalCount; y++) {
                    const movingAnimalDiv = document.createElement("div");
                    movingAnimalDiv.classList.add("movingAnimal", imgAnimal);
                    stage.appendChild(movingAnimalDiv);
                
                    //Move element to spawn point
                    const spawnPoint = spawns[spawnIndex];
                    //(movingAnimalDiv, staticAnimals[x], stage, spawnPoint, 0, true, 1, 1, 0.5);
                    ReparentAndTween(movingAnimalDiv, staticAnimals[x], stage, spawnPoint, undefined, undefined, 0.5, EaseType.EASE_OUT_QUAD)
                
                    //Create MovingAnimal instance
                    const movingAnimal = new MovingAnimal(movingAnimalDiv, new Vector2(spawnPoint.x, spawnPoint.y), x)
                    movingAnimals.push(movingAnimal);
                    spawnIndex++;

                    //Add event listner
                    movingAnimalDiv.addEventListener("click", () => 
                    OnGoodAnimalClicked(movingAnimal));                                        

                    await waitForSeconds(0.1);
                }
            
                await waitForSeconds(0.25);
            }

            await waitForSeconds(0.25);

            //Bad animals
            for (let i = 0; i < badAnimals.length; i++)
            {
                for (let i = 0; i < 3; i++)
                {
                    const movingAnimalDiv = document.createElement("div");
                    movingAnimalDiv.classList.add("movingAnimal");
                    movingAnimalDiv.classList.add(badAnimals[i]);
                    stage.appendChild(movingAnimalDiv);
                    
                    
                    let randomPoint = new Vector2(
                        randomRange(50, stage.clientWidth-50), 
                        randomRange(50, stage.clientHeight-50)
                    );

                    parentRect = stage.getBoundingClientRect();
                    
                    const finalX = randomPoint.x - movingAnimalDiv.clientWidth / 2;
                    const finalY = randomPoint.y - movingAnimalDiv.clientHeight / 2;
                    movingAnimalDiv.style.transform = `translate(${finalX}px, ${finalY}px)`;
                    
                    anim = movingAnimalDiv.animate([
                        { transform: `${movingAnimalDiv.style.transform} scale(0)` },
                        { transform: `${movingAnimalDiv.style.transform} scale(1.2)` },
                        { transform: `${movingAnimalDiv.style.transform} scale(1)` }
                    ], { duration: 500, fill: 'forwards' });

                    movingAnimals.push(new MovingAnimal(movingAnimalDiv, new Vector2(finalX, finalY)));
                    punchAnims.push(anim);

                    await waitForSeconds(.05);                                              
                }
                
            }
            
            await waitForSeconds(.45);
            
            for (let punchAnim of punchAnims){
                punchAnim.commitStyles();
                punchAnim.cancel();
            }
            for (let movingAnimal of movingAnimals){
                movingAnimal.object.style.transition = "transform .1s ease";
            }
                

            animalsLastTime = performance.now();
            requestAnimationFrame(LoopAnimals);
        }
        
        function LoopAnimals(currentTime)
        {
            //Calculate deltatime
            const deltaTime=(currentTime-animalsLastTime)/1000; animalsLastTime=currentTime;

            //Move all animals            
            for (let i = 0; i < movingAnimals.length; i++)
            {
                const animal = movingAnimals[i];                

                //Bounds check
                if (!gameOver){
                    if (animal.position.x < 0 && animal.velocity.x < 0){
                    animal.velocity.x *= -1;
                    animal.scale *= -1;
                }                    
                if (animal.position.x > (stage.clientWidth - animal.object.clientWidth) && animal.velocity.x > 0){
                    animal.velocity.x *= -1;
                    animal.scale *= -1;
                }                    
                if (animal.position.y < 0 && animal.velocity.y < 0)
                    animal.velocity.y *= -1;
                if (animal.position.y > (stage.clientHeight - animal.object.clientHeight) && animal.velocity.y > 0)
                    animal.velocity.y *= -1;
                }                

                //Move animal
                animal.position.MTranslate(animal.velocity.Multiply(deltaTime).Multiply(moveSpeedMult));
                animal.object.style.transform = `translate(${animal.position.x}px, ${animal.position.y}px) scaleX(${animal.scale})`;
            }

            //Continue loop
            requestAnimationFrame(LoopAnimals);
        }

        //UI Callbacks
        function OnGoodAnimalClicked(animal)
        {                        
            const jar = document.getElementById("jar");
            const jarAnimRoot = document.getElementById("jarAnimRoot");
            const jarGraphic = document.getElementById("jarGraphic");
            const jarGraphicWrapper = document.getElementById("jarGraphicWrapper");
            const jarLid = document.getElementById("jarLid");
            const animalsPerLayer = 3;      
            const paddingLeft = jar.clientWidth * 0.35;
            const paddingBottom = jar.clientHeight * 0.2;
            const usableWidth = jar.clientWidth - 100;
            const usableHeight = jar.clientHeight - 100;
            const layerIndex = Math.floor(totalMatches / animalsPerLayer);       
            const indexInLayer = totalMatches % animalsPerLayer;

            //ReparentMoveElement(animal.object, null, document.getElementById("jar"),             
            //new Vector2(((usableWidth / animalsPerLayer) * indexInLayer) + paddingLeft, (jar.clientHeight - (usableHeight / 4) * layerIndex) - paddingBottom), 
            //-screen.height/2, false, 1,.5, 0.5);
            ReparentAndTween(animal.object, null, jarAnimRoot,
            new Vector2(((usableWidth / animalsPerLayer) * indexInLayer) + paddingLeft, (jar.clientHeight - (usableHeight / 4) * layerIndex) - paddingBottom),
            randomRange(-400,-700), 0.7, 0.6, EaseType.LINEAR, screen.height/2);

            jarGraphic.animate([                        
                        
                        { transform: `${jarGraphicWrapper.style.transform} rotate(14.74deg)`, offset: 0.267},
                        { transform: `${jarGraphicWrapper.style.transform} rotate(15.89deg)`, offset: 0.535},
                        { transform: `${jarGraphicWrapper.style.transform} rotate(0deg)`, offset: 0.714},
                        { transform: `${jarGraphicWrapper.style.transform} rotate(0deg)`, offset: 1},
                    ], { duration: 933, easing: 'ease-in-out', fill: 'forwards' });

            jarGraphicWrapper.animate([                        
                        
                        { transform: `${jarGraphicWrapper.style.transform} rotate(14.74deg)`, offset: 0.267},
                        { transform: `${jarGraphicWrapper.style.transform} rotate(15.89deg)`, offset: 0.535},
                        { transform: `${jarGraphicWrapper.style.transform} rotate(0deg)`, offset: 0.714},
                        { transform: `${jarGraphicWrapper.style.transform} rotate(0deg)`, offset: 1},
                    ], { duration: 933, easing: 'ease-in-out', fill: 'forwards' });

            jarAnimRoot.animate([
                              
                        { transform: `${jar.style.transform} translate(0,-25px)`, offset: 0.125},
                        { transform: `${jar.style.transform} translate(0,0)`, offset: 0.267},
                        { transform: `${jar.style.transform} translate(0,0)`, offset: 0.714},
                        { transform: `${jar.style.transform} translate(0,32.5px)`, offset: 0.803},
                        { transform: `${jar.style.transform} translate(0,0)`, offset: 1},
                    ], { duration: 933, easing: 'ease-in-out', fill: 'forwards' });
                    
            jarLid.animate([
                                            
                    { transform: `${jarLid.style.transform} translate(-121.5px,-125px) rotate(-68.803deg)`, offset: 0.267},
                    { transform: `${jarLid.style.transform} translate(-134.5px,-121.5px) rotate(-74.246deg)`, offset: 0.535},
                    { transform: `${jarLid.style.transform} translate(0,0) rotate(0deg)`, offset: 0.803},
                    { transform: `${jarLid.style.transform} translate(0,0)`, offset: 1},
                ], { duration: 933, easing: 'ease-in-out', fill: 'forwards' });

            matchedAnimals[animal.typeIndex] += 1;
            movingAnimals.splice(movingAnimals.indexOf(animal), 1);

            totalMatches++;

            if (matchedAnimals[animal.typeIndex] >= animalCount)
            {
                staticAnimals[animal.typeIndex].style.backgroundColor = "rgba(208, 208, 208, 0)";
                staticAnimals[animal.typeIndex].getBoundingClientRect(); //Force reflow to restart animation
                staticAnimals[animal.typeIndex].style.backgroundColor = "rgba(208, 208, 208, .5)";

                const checkMark = document.createElement("div");
                checkMark.classList.add("checkMark");
                staticAnimals[animal.typeIndex].appendChild(checkMark);

                if(totalMatches > animalCount * goodAnimals.length - 1)
                    EndGame();
            }
        }

        function OnBadAnimalClicked(animal)
        {
            
        }

        //Particles
        function LoopParticles(currentTime)
        {
            //Calculate deltatime + Clear canvas
            const deltaTime=(currentTime-lastTime)/1000; lastTime=currentTime;
            ctx.clearRect(0,0,canvas.width,canvas.height);
        
            //Tick all particles
            particles.forEach((_,i)=>particles[i].TickParticle(deltaTime));
        
            //Destroy dead particles
            for(let i=particles.length-1;i>=0;i--){
                if(particles[i].dead){
                    particles[i].object?.remove?.();
                    particles.splice(i,1);
                }
            }
        
            //Continue loop
            requestAnimationFrame(LoopParticles);
        }

        //MRAID Initialization
        function MraidInitialization()
        {
            if (typeof mraid === "undefined") 
            {
                console.log("Not in an MRAID environment yet.");                
                StartGame();
                return;
            }
        
            if (typeof mraid !== "undefined") 
            {
                if (mraid.getState() === "loading")             
                    mraid.addEventListener("ready", onMraidReady); 
                else
                    onMraidReady();
            }
        }

        function onMraidReady() 
        {                  
            //Wait for viewable state
            mraid.addEventListener("viewableChange", function(isViewable) {
                if (isViewable) {
                    StartGame();
                }
            });
        
            //If viewable already
            if (mraid.isViewable()) {
                StartGame();
            }
        }

        MraidInitialization();
    </script>
</body>
</html>
